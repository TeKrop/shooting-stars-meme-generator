# IMPORTANT: UPLOADS_DIR defaults to /tmp/shooting-stars-uploads.
# A production deployment MUST set it in .env to the real persistent host
# path. Uploads otherwise land in a temporary directory instead.
services:
  bun:
    build: .
    command: bun /app/server/server.ts
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${APP_PORT:-9595}:9595"
    volumes:
      - ${UPLOADS_DIR:-/tmp/shooting-stars-uploads}:/app/uploads
    healthcheck:
      # The oven/bun:1 image holds no wget and no curl, unlike the old
      # Alpine one (see Dockerfile). One healthcheck does not justify another
      # package, so use the fetch() of Bun instead.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://0.0.0.0:9595').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s

  bun-dev:
    build:
      context: .
      target: dev
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${APP_PORT:-9595}:9595"
    volumes:
      - ${UPLOADS_DIR:-/tmp/shooting-stars-uploads}:/app/uploads
      - ./server:/app/server
      - ./client:/app/client
      - ./scripts:/app/scripts
      - ./tsconfig.json:/app/tsconfig.json
      - ./biome.json:/app/biome.json
      - ./package.json:/app/package.json
      - ./.gitignore:/app/.gitignore
      - ./tests:/app/tests
    profiles:
      - dev

  cleanup:
    build: ./scripts
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ${UPLOADS_DIR:-/tmp/shooting-stars-uploads}:/uploads
    restart: unless-stopped
